<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase 2.2 — Discussion Questions</title>
<style>
body{font:15px/1.5 system-ui,sans-serif;margin:0;background:#f8fafc;color:#0f172a}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 24px;z-index:2}
h1{font-size:18px;margin:0 0 6px}
.bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin:6px 0}
.fill{height:100%;background:#22c55e;width:0}
button{font:inherit;padding:6px 14px;border:1px solid #94a3b8;border-radius:6px;background:#fff;cursor:pointer}
main{padding:16px 24px;max-width:1300px;margin:auto}
details{margin-bottom:16px}summary{font-weight:600;font-size:16px;cursor:pointer;padding:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{border:1px solid #e2e8f0;background:#fff;border-radius:8px;padding:12px}
.card.done{border:2px solid #22c55e;background:#f0fdf4}
.id{display:inline-block;background:#0f172a;color:#fff;border-radius:4px;padding:0 6px;font-size:12px;margin-right:6px}
.ctx{color:#64748b;font-style:italic;font-size:13px;margin:6px 0}
label.opt{display:block;padding:4px 0;cursor:pointer}
.opt small{display:block;color:#475569;margin-left:22px}
textarea{width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:6px;padding:6px;font:inherit;min-height:50px}
textarea.has{border:2px solid #f97316}
</style></head><body>
<header><h1>Phase 2.2: rework widgets — Discussion Questions</h1>
<div id="stats"></div><div class="bar"><div class="fill" id="fill"></div></div>
<button onclick="save()">Save answers (download JSON)</button>
<small> Replace <code>02.2-QUESTIONS.json</code> with the downloaded file, then tell Claude "refresh" or "finalize".</small></header>
<main id="main"></main>

          "context": "The wrappers fix heading ids because MDX-generated ids are fragile (research Pattern 4) and the wrappers also feed props (fixture subset for the playground, the licence-notices address from the site base). Moving to MDX means h2 ids and prop wiring move into the post. The pinned-sentence tests in post-content.test.ts must follow.",

            { "id": "b", "label": "Plain ## headings, widgets labelled by their own aria-label (no heading id link)", "description": "Simplest; the widget names itself for screen readers." },

          "options": [
            { "id": "a", "label": "Post MDX imports data modules and passes props", "description": "Everything visible in the MDX; a little code in the post." },
            { "id": "b", "label": "A small shared .ts module exports ready-made props; MDX only passes them", "description": "Keeps the MDX tidy. No .astro wrapper." },
            { "id": "c", "label": "Planner decides", "description": "" }
          ],
          "answer": null, "chat_more": "", "status": "unanswered"
        }
      ]
    },
    {
      "id": "playground",
      "title": "Playground: single text + IDs view",
      "questions": [
        {

          "context": "The stepper currently shows chips with the character on top and its byte value below (BpeStepper.svelte 'chars' stream). TokenDisplay has 'text' and 'ids' modes plus a TokenTable text alternative and TokenRows.svelte.",

            { "id": "b", "label": "Chip with text; ID as a small label tucked under the chip, outside the outline", "description": "Cleaner chips, the ID reads as secondary." },
            { "id": "c", "label": "Two aligned rows per line (text row, ID row)", "description": "Strong table feel; harder to wrap." }
          ],
          "answer": null, "chat_more": "", "status": "unanswered"
        },
        {
          "id": "Q-09",
          "title": "Bytes and the text alternative after removing 'Peek under the hood'",
          "context": "Phase 1 D-04: hex is shown on partial-character chips by default; the peek toggle revealed bytes for everything. The accessible TokenTable and the IDs toggle (D-08) also exist.",
          "options": [
            { "id": "a", "label": "Keep hex on partial-character chips only; drop the toggle; keep the table alternative", "description": "Smallest change. Removes whole-string byte view." },
            { "id": "b", "label": "As a, and the table alternative also lists bytes per token", "description": "Bytes stay discoverable for curious readers without a toggle." },
            { "id": "c", "label": "Drop bytes entirely except where needed to avoid a replacement symbol", "description": "Hex still shown on partial chips (required by FOUND-06)." }
          ],
          "answer": null, "chat_more": "", "status": "unanswered"
        },
        {
          "id": "Q-10",
          "title": "Does the post prose about 'peeking' and the IDs toggle change?",
          "context": "The playground lead-in and 'Takeaways' may mention the toggle and the peek switch; pinned sentences exist in post-content.test.ts.",
          "options": [
            { "id": "a", "label": "Rewrite the affected sentences; update pinned tests together", "description": "Matches Phase 2.1 D-15 practice." },
            { "id": "b", "label": "Rewrite and require another non-programmer read-through of those passages", "description": "Human-gated final task as in Phases 2 and 2.1." }
          ],
          "answer": null, "chat_more": "", "status": "unanswered"
        }
      ]
    },
    {
      "id": "compare",
      "title": "Merged comparison and languages widget",
      "questions": [

            { "id": "a", "label": "One picker: five examples plus six language lines; right side shows GPT-2 vs BERT cuts", "description": "Languages become more entries in the same list; a counts table sits under the cuts." },

          ],
          "answer": null, "chat_more": "", "status": "unanswered"
        },
        {
          "id": "Q-12",
          "title": "Is the languages table still the primary accessible form?",

          ],

    {
      "id": "verify",
      "title": "Verification",
      "questions": [
        {
          "id": "Q-14",

        }

;
function stats(){let t=0,a=0,c=0;DATA.sections.forEach(s=>s.questions.forEach(q=>{t++;if(q.answer)a++;if(q.chat_more)c++;}));
DATA.stats={total:t,answered:a,chat_more:c,remaining:t-a};
document.getElementById('stats').textContent=t+' total | '+a+' answered | '+(t-a)+' remaining';
document.getElementById('fill').style.width=(100*a/t)+'%';}
function render(){const m=document.getElementById('main');m.innerHTML='';
DATA.sections.forEach(s=>{const d=document.createElement('details');d.open=true;
const n=s.questions.filter(q=>q.answer).length;
d.innerHTML='<summary>'+s.title+' ('+n+'/'+s.questions.length+' answered)</summary>';
const g=document.createElement('div');g.className='grid';
s.questions.forEach(q=>{const c=document.createElement('div');c.className='card'+(q.answer?' done':'');
c.innerHTML='<span class="id">'+q.id+'</span><b>'+q.title+'</b><div class="ctx">'+q.context+'</div>';
q.options.forEach(o=>{const l=document.createElement('label');l.className='opt';
const r=document.createElement('input');r.type='radio';r.name=q.id;r.checked=q.answer===o.id;
r.onchange=()=>{q.answer=o.id;q.status='answered';stats();c.className='card done';};
l.append(r,' ');const b=document.createElement('b');b.textContent=o.label;l.append(b);
if(o.description){const sm=document.createElement('small');sm.textContent=o.description;l.append(sm);}
c.append(l);});
const t=document.createElement('textarea');t.placeholder='Add context, nuance, or clarification for this question...';t.value=q.chat_more||'';
t.className=t.value?'has':'';t.oninput=()=>{q.chat_more=t.value;t.className=t.value?'has':'';if(!q.answer)q.status=t.value?'chat-more':'unanswered';stats();};
c.append(t);g.append(c);});
d.append(g);m.append(d);});stats();}
function save(){stats();const a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}));
a.download='02.2-QUESTIONS.json';a.click();}
render();
</script></body></html>
